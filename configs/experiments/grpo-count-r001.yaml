# Single-task GRPO run: count only.
#
# Immutable. Any behaviour-changing edit means a new experiment id, because
# runs/<id>/frozen_config.yaml is what a reported number points at.
#
#   python -m miqgrpo.train_grpo preflight --config configs/experiments/grpo-count-r001.yaml
#   python -m miqgrpo.train_grpo train     --config configs/experiments/grpo-count-r001.yaml

experiment:
  id: grpo-count-r001
  task_family: count
  notes: >-
    Counting only: how many rings, heteroatoms, functional groups. Reward is the official binary count verifier.

model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  revision: null
  dtype: bfloat16
  attn_implementation: null
  peft:
    # 0.5B fits comfortably in a single A100; full fine-tuning avoids the extra
    # variable an adapter would introduce into the baseline comparison.
    enabled: false

data:
  artifact_id: miq-train-v001
  split: count
  dev_split: count_dev
  # Filled in from the dataset manifest by scripts/fill_dataset_hash.py, so a
  # run refuses to start against data that changed underneath it.
  expected_hash: null

grpo:
  learning_rate: 1.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  weight_decay: 0.0
  max_grad_norm: 1.0

  # 16 completions/device x 4 accumulation steps = 64 completions per optimizer
  # step = 8 prompt groups of 8. generation_batch_size must stay divisible by
  # num_generations; preflight checks this before the model loads.
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  num_generations: 8

  # Long enough for a short chain of thought plus the answer block. Truncation
  # fraction is logged; raise this if it climbs.
  max_completion_length: 512

  temperature: 1.0
  top_p: 1.0
  top_k: 0
  min_p: null
  repetition_penalty: 1.0

  # beta=0 drops the KL term: with a verifiable binary reward there is no reward
  # model to over-optimise against, and the reference forward pass costs ~30%.
  beta: 0.0
  epsilon: 0.2
  epsilon_high: null
  loss_type: dapo
  scale_rewards: group
  num_iterations: 1
  mask_truncated_completions: false

  max_steps: 500
  num_train_epochs: 1.0
  gradient_checkpointing: true
  bf16: true

rewards:
  # Official verifier, binary. This is the only term that decides rank order.
  correctness_weight: 1.0
  # Shape towards the <answer>{...}</answer> envelope the benchmark extracts.
  # Capped far below correctness so pretty-but-wrong never beats ugly-but-right.
  format_weight: 0.1
  validity_weight: 0.0

runtime:
  seed: 42
  logging_steps: 5
  save_steps: 100
  save_total_limit: 3
  log_completions: true
  num_completions_to_print: 4
  # vLLM colocate roughly triples rollout throughput on one A100 but adds a
  # version-compatibility surface. Validate the plain path first, then flip.
  use_vllm: false
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  report_to: none
  dataloader_num_workers: 0

benchmark_integrity:
  official_benchmark_used_for_training: false
  official_benchmark_used_for_hparam_selection: false
  official_benchmark_used_for_prompt_tuning: false
  official_benchmark_used_for_extraction_tuning: false
  official_benchmark_used_for_checkpoint_selection: false
  official_benchmark_run_ids: []
